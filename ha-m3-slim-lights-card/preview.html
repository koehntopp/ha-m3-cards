<!doctype html>
<meta charset="utf-8">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@mdi/font@7.4.47/css/materialdesignicons.min.css">
<style>
  body { margin: 0; padding: 24px; font-family: Roboto, -apple-system, "Helvetica Neue", sans-serif; min-height: 100vh; background: #1f2230;
         --primary-text-color: #e3e6f0; --card-background-color: #2b2e3d; --secondary-text-color: #9aa0b4; }
  ha-icon { display: inline-flex; }
  h4 { margin: 20px 0 8px; color: var(--secondary-text-color); font-weight: 400; font-size: 13px; }
  .col { width: 520px; }
  body.shot { padding: 0; background: #1f2230; }
  body.shot h4, body.shot section:not(:first-child) { display: none; }
</style>
<div class="col">
  <section><h4>Three lights: tap toggles, drag sideways dims, long press opens more-info</h4><m3-slim-lights-card id="a"></m3-slim-lights-card></section>
  <section><h4>German, four: colour light, switch, unavailable</h4><m3-slim-lights-card id="b"></m3-slim-lights-card></section>
  <section><h4>Last service call</h4><pre id="log" style="color:#9aa0b4"></pre></section>
</div>
<script>
  // ha-icon mock: MDI webfont (HA ships its own); the CSS does not cross into the shadow root
  customElements.define("ha-icon", class extends HTMLElement {
    static observedAttributes = ["icon"];
    connectedCallback() { this.attributeChangedCallback(); }
    attributeChangedCallback() {
      const r = this.getRootNode();
      if (r !== document && !r.querySelector("link[data-mdi]")) {
        const l = document.createElement("link");
        l.rel = "stylesheet"; l.href = document.querySelector("link").href; l.setAttribute("data-mdi", "");
        r.prepend(l);
      }
      this.innerHTML = `<i class="mdi mdi-${(this.getAttribute("icon") ?? "").slice(4)}"></i>`;
    }
  });
  if (location.search.includes("shot")) document.body.classList.add("shot");
</script>
<script src="m3-slim-lights-card.js"></script>
<script>
  let states = {};
  const light = (id, name, b, extra = {}) => (states[id] = { entity_id: id, state: b ? "on" : "off",
    attributes: { friendly_name: name, supported_color_modes: ["brightness"], brightness: b ? Math.round(b * 2.55) : null, ...extra } });
  light("light.led_leiste", "LED Leiste", 72);
  light("light.licht_az", "Licht AZ", 0);
  light("light.aqualicht", "Steckdose 8 - Aqualicht AZ", 100, { supported_color_modes: ["onoff"] });
  light("light.hue", "Hue Wohnzimmer", 40, { supported_color_modes: ["hs"], rgb_color: [120, 170, 255] });
  states["switch.kaffee"] = { entity_id: "switch.kaffee", state: "on", attributes: { friendly_name: "Kaffeemaschine" } };
  states["light.gone"] = { entity_id: "light.gone", state: "unavailable", attributes: { friendly_name: "Garage" } };
  const els = [];
  const push = () => { const h = hass("en"), d = hass("de"); els.forEach(([el, lang]) => (el.hass = lang === "de" ? d : h)); };
  const callService = (domain, service, data) => {
    document.getElementById("log").textContent = `${domain}.${service} ${JSON.stringify(data)}`;
    const st = states[data.entity_id];
    const on = service === "turn_on" || (service === "toggle" && st.state !== "on");
    const b = data.brightness_pct != null ? Math.round(data.brightness_pct * 2.55) : st.attributes.brightness ?? 255;
    states = { ...states, [data.entity_id]: { ...st, state: on ? "on" : "off", attributes: { ...st.attributes, brightness: on ? b : null } } };
    setTimeout(push, 300);
  };
  const hass = (language) => ({ states, language, locale: { language }, callService });
  const mount = (id, config, lang = "en") => { const el = document.getElementById(id); el.setConfig(config); els.push([el, lang]); el.hass = hass(lang); };
  mount("a", { entities: ["light.led_leiste", "light.licht_az", "light.aqualicht"] });
  mount("b", { entities: ["light.hue", { entity: "switch.kaffee", name: "Kaffee" }, "light.gone", "light.licht_az"] }, "de");
  window.__more = [];
  document.addEventListener("hass-more-info", (e) => window.__more.push(e.detail.entityId));
</script>
