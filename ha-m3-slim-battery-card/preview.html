<!doctype html>
<meta charset="utf-8">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@mdi/font@7.4.47/css/materialdesignicons.min.css">
<style>
  body { margin: 0; padding: 24px; font-family: Roboto, -apple-system, "Helvetica Neue", sans-serif; min-height: 100vh; background: #1f2230;
         --primary-text-color: #e3e6f0; --card-background-color: #2b2e3d; --secondary-text-color: #9aa0b4; }
  ha-icon { display: inline-flex; }
  h4 { margin: 20px 0 8px; color: var(--secondary-text-color); font-weight: 400; font-size: 13px; }
  .col { width: 520px; }
  body.shot { padding: 0; background: #1f2230; }
  body.shot h4, body.shot section:not(:first-child) { display: none; }
</style>
<div class="col">
  <section><h4>Default: threshold 30, critical 15, five batteries</h4><m3-slim-battery-card id="a"></m3-slim-battery-card></section>
  <section><h4>Two low batteries, German</h4><m3-slim-battery-card id="b"></m3-slim-battery-card></section>
  <section><h4>Nothing below the threshold</h4><m3-slim-battery-card id="c"></m3-slim-battery-card></section>
</div>
<script>
  // ha-icon mock: MDI webfont (HA ships its own); the CSS does not cross into the shadow root
  customElements.define("ha-icon", class extends HTMLElement {
    connectedCallback() {
      const r = this.getRootNode();
      if (r !== document && !r.querySelector("link[data-mdi]")) {
        const l = document.createElement("link");
        l.rel = "stylesheet"; l.href = document.querySelector("link").href; l.setAttribute("data-mdi", "");
        r.prepend(l);
      }
      this.innerHTML = `<i class="mdi mdi-${this.getAttribute("icon").slice(4)}"></i>`;
    }
  });
  if (location.search.includes("shot")) document.body.classList.add("shot");
</script>
<script src="m3-slim-battery-card.js"></script>
<script>
  const devices = {}, entities = {};
  const bat = (id, device, level, friendly = "Battery") => {
    devices[id] = { name: device }; entities[`sensor.${id}`] = { device_id: id };
    return [`sensor.${id}`, { entity_id: `sensor.${id}`, state: String(level),
      attributes: { friendly_name: friendly, device_class: "battery", unit_of_measurement: "%" } }];
  };
  const all = Object.fromEntries([
    bat("smoke_og", "Rauchmelder OG", 8),
    bat("window_bath", "Fensterkontakt Bad", 12),
    bat("ht_bath", "H&T Bad", 19),
    bat("dimmer", "Hue Dimmer Wohnzimmer", 24),
    bat("ht_kids", "H&T Kinderzimmer", 27),
    bat("lock", "Türschloss", 29),
    bat("ht_kitchen", "H&T Küche", 96),
  ]);
  const hass = (states, language = "en") => ({ states, devices, entities, language, locale: { language } });
  const pick = (...ids) => Object.fromEntries(ids.map((id) => [id, all[id]]));
  const mount = (id, config, h) => { const el = document.getElementById(id); el.setConfig(config); el.hass = h; };
  mount("a", {}, hass(all));
  mount("b", {}, hass(pick("sensor.ht_bath", "sensor.ht_kids", "sensor.ht_kitchen"), "de"));
  mount("c", {}, hass(pick("sensor.ht_kitchen")));
</script>
